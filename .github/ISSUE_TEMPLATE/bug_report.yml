name: Сообщить об ошибке
description: Опишите ошибку, которую можно воспроизвести.
title: "[Ошибка]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Не добавляйте API-ключи, учётные данные и другие секреты. Для уязвимостей используйте приватный канал из SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Опишите фактическое и ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Запустите ...
        2. Настройте ...
        3. Проверьте ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      placeholder: ОС, терминал, версия ChiselCode, способ установки, провайдер и модель (без ключей); Bun — при запуске из исходников.
    validations:
      required: true
