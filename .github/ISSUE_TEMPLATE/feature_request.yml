name: Предложить улучшение
description: Расскажите, как улучшить ChiselCode.
title: "[Улучшение]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу нужно решить?
      description: Опишите сценарий работы или ограничение, которое мешает.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
      description: Опишите желаемое поведение и рассмотренные альтернативы.
    validations:
      required: true
