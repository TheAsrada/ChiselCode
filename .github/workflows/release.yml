name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify, compile, and publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Verify tag version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Compile standalone binaries
        shell: bash
        run: |
          mkdir -p dist/release
          bun build ./src/cli.ts --compile --target=bun-linux-x64 --outfile=dist/release/chisel-linux-x64
          bun build ./src/cli.ts --compile --target=bun-darwin-x64 --outfile=dist/release/chisel-macos-x64
          bun build ./src/cli.ts --compile --target=bun-darwin-arm64 --outfile=dist/release/chisel-macos-arm64
          bun build ./src/cli.ts --compile --target=bun-windows-x64 --outfile=dist/release/chisel-windows-x64.exe
      - name: Create GitHub Release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes --title "ChiselCode $GITHUB_REF_NAME"

  installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: npm ci
      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          bun build ./src/cli.ts --compile --target=bun-windows-x64 --outfile=dist/release/chisel-windows-x64.exe
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
          }
      - name: Build installer
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          makensis "/DVERSION=$ver" installer/chiselcode.nsi
      - name: Upload installer
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          gh release upload "$env:GITHUB_REF_NAME" "dist/release/ChiselCode-Setup-$ver.exe"
