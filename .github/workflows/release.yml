name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching package.json (for example v0.6.1)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Verify tag version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          bun -e 'import { VERSION } from "./src/version.ts"; const lock = require("./package-lock.json"); if (process.env.RELEASE_TAG !== `v${VERSION}` || lock.version !== VERSION || lock.packages[""].version !== VERSION) process.exit(1)'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
      - name: Capture immutable release source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require successful native CI on exact release source
        run: bun scripts/verify-release-ci.ts

  installer-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: verify
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          bun build ./src/cli.ts --compile --target=bun-windows-x64 --outfile=dist/release/chisel-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Windows binary build failed" }
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $actual = & ./dist/release/chisel-windows-x64.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne $ver) { throw "Windows binary version smoke failed" }
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
          }
      - name: Build installer
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          # VIProductVersion принимает только цифры X.X.X.X: суффиксы
          # вроде -hotfix отрезаем, недостающие части добиваем нулями.
          $num = ($ver -replace '[-+].*$','')
          while (($num.Split('.')).Count -lt 4) { $num += '.0' }
          makensis "/DVERSION=$ver" "/DVERSION_NUMERIC=$num" installer/chiselcode.nsi
      - name: Stage Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/release/ChiselCode-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  installer-macos:
    name: Build macOS installers
    runs-on: macos-latest
    needs: verify
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Install both macOS OpenTUI native targets
        shell: bash
        run: |
          npm install --no-save --package-lock=false --force --ignore-scripts \
            @opentui/core-darwin-arm64@0.5.12 @opentui/core-darwin-x64@0.5.12
          test -f node_modules/@opentui/core-darwin-arm64/package.json
          test -f node_modules/@opentui/core-darwin-x64/package.json
      - name: Build macOS binaries
        shell: bash
        run: |
          mkdir -p pkg/macos-arm64 pkg/macos-x64
          bun build ./src/cli.ts --compile --target=bun-darwin-arm64 --outfile=pkg/macos-arm64/chisel
          bun build ./src/cli.ts --compile --target=bun-darwin-x64 --outfile=pkg/macos-x64/chisel
          chmod +x pkg/macos-arm64/chisel pkg/macos-x64/chisel
          for arch in arm64 x64; do
            mkdir -p "pkg/macos-$arch/skills"
            cp -R skills/bundled "pkg/macos-$arch/skills/"
          done
          host_arch=$(uname -m)
          if [ "$host_arch" = x86_64 ]; then host_arch=x64; fi
          ver=$(node -p "require('./package.json').version")
          test "$("pkg/macos-$host_arch/chisel" --version)" = "$ver"
      - name: Build packages
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          pkgbuild --root pkg/macos-arm64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-arm64.pkg"
          pkgbuild --root pkg/macos-x64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-x64.pkg"
      - name: Stage macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: ChiselCode-Setup-*.pkg
          if-no-files-found: error
          retention-days: 7

  installer-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    needs: verify
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Build Linux x64 glibc payload and packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          mkdir -p dist/release
          bun build ./src/cli.ts --compile --target=bun-linux-x64-baseline --outfile=dist/chisel
          scripts/package-linux.sh "$(bun -p 'require("./package.json").version')" dist/chisel dist/release
      - name: Stage Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  package-sdk:
    name: Build npm package and public SDK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: npm ci
      - run: bun run build
      - name: Pack standalone SDK declarations and ordinary CLI
        shell: bash
        run: |
          mkdir -p dist/release
          test "$(bun dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
          npm pack --pack-destination dist/release
          tar -tzf dist/release/chiselcode-*.tgz > "$RUNNER_TEMP/chisel-sdk-files.txt"
          grep -Fqx 'package/dist/extension-sdk/index.d.ts' "$RUNNER_TEMP/chisel-sdk-files.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-sdk
          path: dist/release/chiselcode-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified installers
    runs-on: ubuntu-latest
    needs: [verify, installer-windows, installer-macos, installer-linux, package-sdk]
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SOURCE: ${{ needs.verify.outputs.source }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/release-artifacts
          merge-multiple: true
      - name: Create draft, upload assets, then publish
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          test "v$ver" = "$RELEASE_TAG"
          bun scripts/verify-release-assets.ts seal dist/release-artifacts "$ver"
          files=(dist/release-artifacts/*)
          awk -v ver="$ver" '
            $0 == "## [" ver "]" || $0 ~ "^## \\[" ver "\\] " {flag=1; next}
            /^## \[/ {if (flag) exit; next}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          sed -i -e :a -e '/./,$!d' -e :b -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release-notes.md
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          elif grep -q '[^[:space:]]' /tmp/release-notes.md 2>/dev/null; then
            prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$prev" ]; then
              printf '\n**Полный список изменений**: https://github.com/%s/compare/%s...%s\n' "${{ github.repository }}" "$prev" "$RELEASE_TAG" >> /tmp/release-notes.md
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "ChiselCode $RELEASE_TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "ChiselCode $RELEASE_TAG"
          fi
          for file in "${files[@]}"; do
            for attempt in 1 2; do
              if timeout 180 gh release upload "$RELEASE_TAG" "$file" --clobber; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then exit 1; fi
              sleep 5
            done
          done
          release_id=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id")
          [[ "$release_id" =~ ^[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          bun scripts/verify-release-assets.ts verify dist/release-artifacts "$ver" \
            "repos/${{ github.repository }}/releases/$release_id/assets?per_page=100"
          test "$(gh api "repos/${{ github.repository }}/commits/$RELEASE_TAG" --jq .sha)" = "$VERIFIED_SOURCE"
          bun scripts/verify-release-ci.ts
          gh release edit "$RELEASE_TAG" --draft=false --latest
