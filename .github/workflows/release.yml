name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Verify tag version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Create GitHub Release
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          # Вырезаем секцию ## [ver] из CHANGELOG.md до следующего ## [
          awk -v ver="$ver" '
            $0 == "## [" ver "]" || $0 ~ "^## \\[" ver "\\] " {flag=1; next}
            /^## \[/ {if (flag) exit; next}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          # Убираем пустые строки по краям, проверяем что осталось непустое
          sed -i -e :a -e '/./,$!d' -e :b -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release-notes.md
          if grep -q '[^[:space:]]' /tmp/release-notes.md 2>/dev/null; then
            # Предыдущий релиз = последний созданный (текущий тег ещё не опубликован)
            prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "${{ github.repository }}" "$prev" "$GITHUB_REF_NAME" >> /tmp/release-notes.md
            fi
            gh release create "$GITHUB_REF_NAME" --title "ChiselCode $GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "ChiselCode $GITHUB_REF_NAME"
          fi

  installer-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: npm ci
      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          bun build ./src/cli.ts --compile --target=bun-windows-x64 --outfile=dist/release/chisel-windows-x64.exe
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
          }
      - name: Build installer
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          makensis "/DVERSION=$ver" installer/chiselcode.nsi
      - name: Upload installer
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          gh release upload "$env:GITHUB_REF_NAME" "dist/release/ChiselCode-Setup-$ver.exe"

  installer-macos:
    name: Build macOS installers
    runs-on: macos-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: npm ci
      - name: Build macOS binaries
        shell: bash
        run: |
          mkdir -p pkg/macos-arm64 pkg/macos-x64
          bun build ./src/cli.ts --compile --target=bun-darwin-arm64 --outfile=pkg/macos-arm64/chisel
          bun build ./src/cli.ts --compile --target=bun-darwin-x64 --outfile=pkg/macos-x64/chisel
          chmod +x pkg/macos-arm64/chisel pkg/macos-x64/chisel
      - name: Build packages
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          pkgbuild --root pkg/macos-arm64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-arm64.pkg"
          pkgbuild --root pkg/macos-x64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-x64.pkg"
      - name: Upload installers
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ChiselCode-Setup-*.pkg

  installer-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install dependencies
        run: npm ci
      - name: Build .deb package
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          root="pkg/chiselcode_${ver}_amd64"
          mkdir -p "$root/DEBIAN" "$root/usr/bin"
          bun build ./src/cli.ts --compile --target=bun-linux-x64 --outfile="$root/usr/bin/chisel"
          chmod 0755 "$root/usr/bin/chisel"
          cat > "$root/DEBIAN/control" <<EOF
          Package: chiselcode
          Version: $ver
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ChiselCode <https://github.com/TheAsrada/ChiselCode>
          Description: Secure multi-provider coding agent CLI
           ChiselCode reads and explains projects, finds bugs and edits files
           with confirmation.
          EOF
          dpkg-deb --build "$root" "ChiselCode-Setup-${ver}-linux-amd64.deb"
      - name: Upload installer
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ChiselCode-Setup-*-linux-amd64.deb
