name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Verify tag version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Create GitHub Release
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          # Вырезаем секцию ## [ver] из CHANGELOG.md до следующего ## [
          awk -v ver="$ver" '
            $0 == "## [" ver "]" || $0 ~ "^## \\[" ver "\\] " {flag=1; next}
            /^## \[/ {if (flag) exit; next}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          # Убираем пустые строки по краям, проверяем что осталось непустое
          sed -i -e :a -e '/./,$!d' -e :b -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release-notes.md
          if grep -q '[^[:space:]]' /tmp/release-notes.md 2>/dev/null; then
            # Предыдущий релиз = последний созданный (текущий тег ещё не опубликован)
            prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$prev" ]; then
              printf '\n**Полный список изменений**: https://github.com/%s/compare/%s...%s\n' "${{ github.repository }}" "$prev" "$GITHUB_REF_NAME" >> /tmp/release-notes.md
            fi
            gh release create "$GITHUB_REF_NAME" --title "ChiselCode $GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "ChiselCode $GITHUB_REF_NAME"
          fi

  installer-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          bun build ./src/cli.ts --compile --target=bun-windows-x64 --outfile=dist/release/chisel-windows-x64.exe
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
          }
      - name: Build installer
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          # VIProductVersion принимает только цифры X.X.X.X: суффиксы
          # вроде -hotfix отрезаем, недостающие части добиваем нулями.
          $num = ($ver -replace '[-+].*$','')
          while (($num.Split('.')).Count -lt 4) { $num += '.0' }
          makensis "/DVERSION=$ver" "/DVERSION_NUMERIC=$num" installer/chiselcode.nsi
      - name: Upload installer
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ver = node -p "require('./package.json').version"
          $asset = "dist/release/ChiselCode-Setup-$ver.exe"
          # gh release upload иногда виснет на windows-раннере (v0.5.5, v0.5.6):
          # гоняем в фоновой задаче с таймаутом и ретраями, --clobber добивает
          # частично загруженный ассет повторной попыткой.
          $ok = $false
          for ($attempt = 1; $attempt -le 3 -and -not $ok; $attempt += 1) {
            Write-Host "Upload attempt $attempt/3: $asset"
            $job = Start-Job -ScriptBlock {
              param($tag, $file, $token)
              $env:GH_TOKEN = $token
              gh release upload $tag $file --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release upload exited $LASTEXITCODE" }
            } -ArgumentList "$env:GITHUB_REF_NAME", $asset, "$env:GH_TOKEN"
            if (Wait-Job $job -Timeout 300) {
              Receive-Job $job
              if ($job.State -eq "Completed") { $ok = $true }
              else { Write-Host "Attempt $attempt failed ($($job.State)), retrying…" }
            } else {
              Write-Host "Attempt $attempt timed out after 300s, retrying…"
              Stop-Job $job
            }
            Remove-Job $job -Force
          }
          if (-not $ok) { throw "Upload failed after 3 attempts: $asset" }

  installer-macos:
    name: Build macOS installers
    runs-on: macos-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Build macOS binaries
        shell: bash
        run: |
          mkdir -p pkg/macos-arm64 pkg/macos-x64
          bun build ./src/cli.ts --compile --target=bun-darwin-arm64 --outfile=pkg/macos-arm64/chisel
          bun build ./src/cli.ts --compile --target=bun-darwin-x64 --outfile=pkg/macos-x64/chisel
          chmod +x pkg/macos-arm64/chisel pkg/macos-x64/chisel
          for arch in arm64 x64; do
            mkdir -p "pkg/macos-$arch/skills"
            cp -R skills/code-review skills/skill-creator "pkg/macos-$arch/skills/"
          done
      - name: Build packages
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          pkgbuild --root pkg/macos-arm64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-arm64.pkg"
          pkgbuild --root pkg/macos-x64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-x64.pkg"
      - name: Upload installers
        shell: bash
        timeout-minutes: 40
        run: |
          # NOTE: без GNU timeout (его нет на macOS): watchdog через sleep+kill.
          # Грузим по одному файлу: зависший ассет не блокирует остальные,
          # у каждого — свои попытки.
          ls -la ChiselCode-Setup-*.pkg
          upload_one() {
            file="$1"
            for i in 1 2 3 4; do
              echo "Upload $file (attempt $i/4)"
              gh release upload "$GITHUB_REF_NAME" "$file" --clobber & pid=$!
              ( sleep 300; kill -9 "$pid" 2>/dev/null ) & watcher=$!
              if wait "$pid"; then kill "$watcher" 2>/dev/null || true; return 0; fi
              kill "$watcher" 2>/dev/null || true
              echo "Attempt $i failed or timed out, retrying…"; sleep 10
            done
            return 1
          }
          ok=1
          for f in ChiselCode-Setup-*.pkg; do upload_one "$f" || ok=0; done
          [ "$ok" = 1 ] || { echo "Upload failed"; exit 1; }

  installer-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    needs: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Build .deb package
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          root="pkg/chiselcode_${ver}_amd64"
          mkdir -p "$root/DEBIAN" "$root/usr/bin"
          bun build ./src/cli.ts --compile --target=bun-linux-x64 --outfile="$root/usr/bin/chisel"
          chmod 0755 "$root/usr/bin/chisel"
          mkdir -p "$root/usr/bin/skills"
          cp -R skills/code-review skills/skill-creator "$root/usr/bin/skills/"
          cat > "$root/DEBIAN/control" <<EOF
          Package: chiselcode
          Version: $ver
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ChiselCode <https://github.com/TheAsrada/ChiselCode>
          Description: Secure multi-provider coding agent CLI
           ChiselCode reads and explains projects, finds bugs and edits files
           with confirmation.
          EOF
          dpkg-deb --build "$root" "ChiselCode-Setup-${ver}-linux-amd64.deb"
      - name: Upload installer
        shell: bash
        timeout-minutes: 20
        run: |
          # NOTE: без GNU timeout (его нет на macOS): watchdog через sleep+kill.
          ok=0
          for i in 1 2 3; do
            echo "Upload attempt $i/3"
            gh release upload "$GITHUB_REF_NAME" ChiselCode-Setup-*-linux-amd64.deb --clobber & pid=$!
            ( sleep 300; kill -9 "$pid" 2>/dev/null ) & watcher=$!
            if wait "$pid"; then ok=1; kill "$watcher" 2>/dev/null || true; break; fi
            kill "$watcher" 2>/dev/null || true
            echo "Attempt $i failed or timed out, retrying…"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "Upload failed after 3 attempts"; exit 1; }
