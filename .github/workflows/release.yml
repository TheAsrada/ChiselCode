name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Verify tag version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

  installer-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: verify
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Build Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          bun build ./src/cli.ts --compile --target=bun-windows-x64 --outfile=dist/release/chisel-windows-x64.exe
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'
          }
      - name: Build installer
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          # VIProductVersion принимает только цифры X.X.X.X: суффиксы
          # вроде -hotfix отрезаем, недостающие части добиваем нулями.
          $num = ($ver -replace '[-+].*$','')
          while (($num.Split('.')).Count -lt 4) { $num += '.0' }
          makensis "/DVERSION=$ver" "/DVERSION_NUMERIC=$num" installer/chiselcode.nsi
      - name: Stage Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/release/ChiselCode-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  installer-macos:
    name: Build macOS installers
    runs-on: macos-latest
    needs: verify
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Install both macOS OpenTUI native targets
        shell: bash
        run: |
          npm install --no-save --package-lock=false --force --ignore-scripts \
            @opentui/core-darwin-arm64@0.5.12 @opentui/core-darwin-x64@0.5.12
          test -f node_modules/@opentui/core-darwin-arm64/package.json
          test -f node_modules/@opentui/core-darwin-x64/package.json
      - name: Build macOS binaries
        shell: bash
        run: |
          mkdir -p pkg/macos-arm64 pkg/macos-x64
          bun build ./src/cli.ts --compile --target=bun-darwin-arm64 --outfile=pkg/macos-arm64/chisel
          bun build ./src/cli.ts --compile --target=bun-darwin-x64 --outfile=pkg/macos-x64/chisel
          chmod +x pkg/macos-arm64/chisel pkg/macos-x64/chisel
          for arch in arm64 x64; do
            mkdir -p "pkg/macos-$arch/skills"
            cp -R skills/bundled "pkg/macos-$arch/skills/"
          done
      - name: Build packages
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          pkgbuild --root pkg/macos-arm64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-arm64.pkg"
          pkgbuild --root pkg/macos-x64 --identifier com.chiselcode.cli --version "$ver" --install-location /usr/local/bin "ChiselCode-Setup-$ver-macos-x64.pkg"
      - name: Stage macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: ChiselCode-Setup-*.pkg
          if-no-files-found: error
          retention-days: 7

  installer-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    needs: verify
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Build .deb package
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          root="pkg/chiselcode_${ver}_amd64"
          mkdir -p "$root/DEBIAN" "$root/usr/bin"
          bun build ./src/cli.ts --compile --target=bun-linux-x64 --outfile="$root/usr/bin/chisel"
          chmod 0755 "$root/usr/bin/chisel"
          mkdir -p "$root/usr/bin/skills"
          cp -R skills/bundled "$root/usr/bin/skills/"
          cat > "$root/DEBIAN/control" <<EOF
          Package: chiselcode
          Version: $ver
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ChiselCode <https://github.com/TheAsrada/ChiselCode>
          Description: Secure multi-provider coding agent CLI
           ChiselCode reads and explains projects, finds bugs and edits files
           with confirmation.
          EOF
          dpkg-deb --build "$root" "ChiselCode-Setup-${ver}-linux-amd64.deb"
      - name: Stage Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: ChiselCode-Setup-*-linux-amd64.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified installers
    runs-on: ubuntu-latest
    needs: [verify, installer-windows, installer-macos, installer-linux]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/release-artifacts
          merge-multiple: true
      - name: Create draft, upload assets, then publish
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          test "v$ver" = "$GITHUB_REF_NAME"
          files=(dist/release-artifacts/ChiselCode-Setup-*)
          test "${#files[@]}" -eq 4
          test -f "dist/release-artifacts/ChiselCode-Setup-$ver.exe"
          test -f "dist/release-artifacts/ChiselCode-Setup-$ver-macos-arm64.pkg"
          test -f "dist/release-artifacts/ChiselCode-Setup-$ver-macos-x64.pkg"
          test -f "dist/release-artifacts/ChiselCode-Setup-$ver-linux-amd64.deb"
          awk -v ver="$ver" '
            $0 == "## [" ver "]" || $0 ~ "^## \\[" ver "\\] " {flag=1; next}
            /^## \[/ {if (flag) exit; next}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          sed -i -e :a -e '/./,$!d' -e :b -e '/^\n*$/{$d;N;ba' -e '}' /tmp/release-notes.md
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = true
          elif grep -q '[^[:space:]]' /tmp/release-notes.md 2>/dev/null; then
            prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$prev" ]; then
              printf '\n**Полный список изменений**: https://github.com/%s/compare/%s...%s\n' "${{ github.repository }}" "$prev" "$GITHUB_REF_NAME" >> /tmp/release-notes.md
            fi
            gh release create "$GITHUB_REF_NAME" --draft --title "ChiselCode $GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "ChiselCode $GITHUB_REF_NAME"
          fi
          for file in "${files[@]}"; do
            for attempt in 1 2; do
              if timeout 180 gh release upload "$GITHUB_REF_NAME" "$file" --clobber; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then exit 1; fi
              sleep 5
            done
          done
          count=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          test "$count" -eq 4
          gh release edit "$GITHUB_REF_NAME" --draft=false
