name: Complete verified release 0.6.25

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-sdk-recovery.yml]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'complete-release-v0.6.25')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 558a2b7061b9c5407b734d747509f62deaaa9019
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.6.25
      - name: Confirm immutable tag, successful platform CI and installer provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api repos/${{ github.repository }}/actions/runs/38378693802 --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api repos/${{ github.repository }}/actions/runs/38378693802 --jq .conclusion)" = success
          test "$(gh api repos/${{ github.repository }}/actions/runs/38385429803 --jq .head_sha)" = "$SOURCE_SHA"
          gh api repos/${{ github.repository }}/actions/runs/38385429803/jobs > "$RUNNER_TEMP/release-jobs.json"
          jq -e '[.jobs[] | select(.name == "Build Windows installer" or .name == "Build macOS installers" or .name == "Build Linux installer")] | length == 3 and all(.[]; .conclusion == "success")' "$RUNNER_TEMP/release-jobs.json"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: npm ci
      - run: bun run build
      - name: Pack and verify the public SDK from the exact tag
        shell: bash
        run: |
          mkdir -p dist/release-artifacts
          npm pack --pack-destination dist/release-artifacts
          tar -tzf dist/release-artifacts/chiselcode-0.6.25.tgz > "$RUNNER_TEMP/sdk-files.txt"
          grep -Fqx 'package/dist/extension-sdk/index.d.ts' "$RUNNER_TEMP/sdk-files.txt"
          grep -Fqx 'package/dist/extension-sdk/index.js' "$RUNNER_TEMP/sdk-files.txt"
          test "$(node -p "require('./package.json').version")" = 0.6.25
      - name: Download successful installers built from the same tag
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38385429803
          pattern: installer-*
          path: dist/release-artifacts
          merge-multiple: true
      - name: Publish all five verified assets
        shell: bash
        run: |
          files=(dist/release-artifacts/ChiselCode-Setup-* dist/release-artifacts/chiselcode-*.tgz)
          test "${#files[@]}" -eq 5
          test -f dist/release-artifacts/ChiselCode-Setup-0.6.25.exe
          test -f dist/release-artifacts/ChiselCode-Setup-0.6.25-macos-arm64.pkg
          test -f dist/release-artifacts/ChiselCode-Setup-0.6.25-macos-x64.pkg
          test -f dist/release-artifacts/ChiselCode-Setup-0.6.25-linux-amd64.deb
          test -f dist/release-artifacts/chiselcode-0.6.25.tgz
          awk '/^## \[0.6.25\]/{flag=1; next} /^## \[/{if(flag) exit} flag{print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if gh release view v0.6.25 --json isDraft > "$RUNNER_TEMP/current-release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/current-release.json")" = true
          else
            gh release create v0.6.25 --verify-tag --draft --title 'ChiselCode v0.6.25' --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          for file in "${files[@]}"; do
            timeout 180 gh release upload v0.6.25 "$file" --clobber
          done
          test "$(gh release view v0.6.25 --json assets --jq '.assets | length')" = 5
          gh release edit v0.6.25 --draft=false
