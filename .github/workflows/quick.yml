name: Quick CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/assets/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/assets/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fast deterministic tests
        run: bun run test:fast
      - name: Type check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Build CLI and SDK
        run: bun run build
      - name: Check built CLI starts
        run: bun dist/cli.js --version
