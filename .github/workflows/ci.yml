name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Deterministic runtime evaluation
        run: bun run eval --category all
      - name: Build package
        run: bun run build
      - name: Smoke installed npm package
        shell: bash
        run: |
          tarball=$(npm pack --silent --pack-destination dist)
          npm install --prefix ./dist/install-smoke "./dist/$tarball"
          bun ./dist/install-smoke/node_modules/chiselcode/dist/cli.js --version
          bun ./dist/install-smoke/node_modules/chiselcode/dist/cli.js doctor > installed-doctor.txt || status=$?
          test "${status:-0}" -eq 0 -o "${status:-0}" -eq 2
          grep -q 'ChiselCode' installed-doctor.txt
      - name: Compile and smoke OpenTUI native binary
        shell: bash
        run: |
          mkdir -p dist
          binary=dist/opentui-spike
          if [ "$RUNNER_OS" = Windows ]; then binary+=.exe; fi
          bun build ./scripts/opentui-spike.tsx --compile --outfile="$binary"
          "$binary" --version
          "$binary" --smoke
      - name: Cross-compile macOS OpenTUI native targets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm install --no-save --package-lock=false --force --ignore-scripts \
            @opentui/core-darwin-arm64@0.5.12 @opentui/core-darwin-x64@0.5.12
          test -f node_modules/@opentui/core-darwin-arm64/package.json
          test -f node_modules/@opentui/core-darwin-x64/package.json
          for arch in arm64 x64; do
            bun build ./scripts/opentui-spike.tsx --compile --target="bun-darwin-$arch" --outfile="dist/opentui-spike-$arch"
          done
          host_arch=$(uname -m)
          if [ "$host_arch" = x86_64 ]; then host_arch=x64; fi
          "dist/opentui-spike-$host_arch" --smoke
      - name: Smoke compiled CLI commands
        shell: bash
        run: |
          binary=dist/chisel
          if [ "$RUNNER_OS" = Windows ]; then binary+=.exe; fi
          bun build ./src/cli.ts --compile --outfile="$binary"
          "$binary" --version
          "$binary" doctor > doctor-output.txt || status=$?
          test "${status:-0}" -eq 0 -o "${status:-0}" -eq 2
          grep -q 'ChiselCode' doctor-output.txt
      - name: Validate Windows updater installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
            $env:PATH += ';C:\Program Files (x86)\NSIS'
          }
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/chisel.exe dist/release/chisel-windows-x64.exe
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $num = ($ver -replace '-.*$', '') + '.0'
          makensis "/V2" "/DVERSION=$ver" "/DVERSION_NUMERIC=$num" installer/chiselcode.nsi
          if ($LASTEXITCODE -ne 0) { throw "Windows updater installer validation failed" }
      - name: Stage interactive binaries for terminal checks
        uses: actions/upload-artifact@v4
        with:
          name: opentui-terminal-${{ matrix.os }}
          path: |
            dist/chisel*
            dist/opentui-spike*
          if-no-files-found: error
          retention-days: 7
