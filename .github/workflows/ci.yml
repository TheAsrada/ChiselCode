name: Native validation

# Explicit full check before a release or a change to native runtime behavior.
# Ordinary pushes use quick.yml; a release requires this workflow on its exact SHA.
on:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    name: Full source (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHISEL_CAPTURE_DIR: ${{ github.workspace }}/dist/subagent-captures
      CHISEL_THEME_CAPTURES: dist/theme-captures
      CHISEL_EXTERNAL_CAPTURES: ${{ github.workspace }}/dist/external-extension-captures
      CHISEL_EXTENSION_SETTINGS_CAPTURES: dist/extension-settings-captures
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned LSP test dependencies
        run: bun scripts/prepare-lsp-tests.ts
      - run: bun run typecheck
      - name: All source tests once
        shell: bash
        run: |
          set -o pipefail
          if bun run test:full --reporter=junit --reporter-outfile=test-results.xml 2>&1 | tee test-results.log; then exit 0; fi
          bun scripts/report-ci-tests.ts
          exit 1
      - run: bun run lint
      - run: bun run eval --category all
      - name: Extension Settings and external SDK source UI
        run: |
          bun tests/fixtures/tui-extensions-settings.ts
          bun tests/fixtures/tui-external-extensions.ts
      - name: Save real OpenTUI captures and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: |
            dist/*captures/**
            test-results.xml
            test-results.log
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare pinned LSP dependencies for platform tests
        if: runner.os != 'Linux'
        run: bun scripts/prepare-lsp-tests.ts
      - name: Platform paths, atomic storage, shell and process ownership
        if: runner.os != 'Linux'
        run: >-
          bun test tests/unit/workspace-path.test.ts tests/unit/session-atomic.test.ts
          tests/unit/session-lock.test.ts tests/unit/shell-runtime.test.ts
          tests/unit/background-process.test.ts tests/unit/background-owner.test.ts
          tests/unit/tool-actions.test.ts tests/integration/tool-actions-tui.test.ts
          tests/unit/subagent-storage-policy.test.ts
          tests/unit/lsp-transport.test.ts
          tests/unit/extension-authoring.test.ts tests/unit/ui-extension-runtime.test.ts
          tests/integration/ui-extension-tools.test.ts
          tests/unit/provider-config.test.ts tests/unit/lsp-config.test.ts
          tests/unit/opentui-terminal-compatibility.test.tsx tests/unit/opentui-settings.test.tsx
          tests/unit/opentui-navigation.test.tsx tests/unit/opentui-file-diff.test.tsx
          tests/unit/opentui-update.test.tsx tests/unit/opentui-sidebar.test.tsx
          tests/unit/opentui-background.test.tsx tests/unit/opentui-subagents.test.tsx
          tests/unit/opentui-side-query.test.tsx tests/unit/opentui-chat-card.test.tsx
          tests/unit/opentui-web.test.tsx tests/unit/opentui-message.test.tsx
          tests/unit/opentui-clipboard.test.tsx
          tests/integration/graphics-runtime.test.ts
      - name: Build CLI and public SDK
        run: bun run build
      - name: Installed package starts, executes tools, downloads and loads the SDK
        shell: bash
        run: |
          tarball=$(npm pack --silent --pack-destination dist)
          npm install --prefix ./dist/install-smoke --no-audit --no-fund "./dist/$tarball"
          test -f ./dist/install-smoke/node_modules/chiselcode/dist/extension-sdk/ui-composition.d.ts
          test -f ./dist/install-smoke/node_modules/chiselcode/skills/bundled/extension-creator/SKILL.md
          entry=./dist/install-smoke/node_modules/chiselcode/dist/cli.js
          bun "$entry" --version
          bun tests/fixtures/manifest-cli.ts bun "$entry"
          bun tests/fixtures/web-download-cli.ts bun "$entry"
          bun tests/fixtures/external-extensions-cli.ts bun "$entry"
      - name: Compiled CLI, real LSP, helpers, worktrees and background processes
        shell: bash
        run: |
          binary=dist/chisel
          if [ "$RUNNER_OS" = Windows ]; then binary+=.exe; fi
          bun build src/cli.ts --compile --outfile="$binary"
          "$binary" --version
          bun tests/fixtures/web-download-cli.ts "$binary"
          bun tests/fixtures/lsp-cli.ts "$binary"
          bun tests/fixtures/subagents-cli.ts "$binary"
          bun tests/fixtures/worktree-cli.ts "$binary"
          bun tests/fixtures/background-cli.ts "$binary"
          bun tests/fixtures/external-extensions-cli.ts "$binary"
          bun tests/fixtures/extension-packages-cli.ts "$binary"
      - name: Native OpenTUI library loads and renders
        shell: bash
        run: |
          binary=dist/opentui-spike
          if [ "$RUNNER_OS" = Windows ]; then binary+=.exe; fi
          bun build scripts/opentui-spike.tsx --compile --outfile="$binary"
          "$binary" --smoke
      - name: Compiled live UI extension authoring and protected actions
        shell: bash
        run: |
          binary=dist/chisel-ui-creator
          if [ "$RUNNER_OS" = Windows ]; then binary+=.exe; fi
          mkdir -p dist/skills
          cp -R skills/bundled dist/skills/
          bun build tests/fixtures/tui-extension-creator.ts --compile --outfile="$binary"
          "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/chisel*
            dist/opentui-spike*
          if-no-files-found: error
          retention-days: 7
